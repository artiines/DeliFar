name: Android Build & Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Build & Sign DeliFar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore from repository secret
        env:
          KEYSTORE_B64: ${{ secrets.DELIFAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > debug.keystore
            echo "Restored project signing keystore (debug.keystore) from DELIFAR_KEYSTORE_BASE64 secret."
          else
            echo "::warning::DELIFAR_KEYSTORE_BASE64 secret is not set. Building with an ephemeral runner debug keystore; add DELIFAR_KEYSTORE_BASE64 to preserve your existing Android upgrade signing identity."
          fi

      - name: Decode optional google-services.json from repository secret
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "Building in offline-first mode (GOOGLE_SERVICES_JSON_BASE64 secret not set)."
          fi

      - name: Run unit, Room migration & Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble signed APK
        env:
          DELIFAR_DEBUG_STORE_PASSWORD: ${{ secrets.DELIFAR_DEBUG_STORE_PASSWORD }}
          DELIFAR_DEBUG_KEY_ALIAS: ${{ secrets.DELIFAR_DEBUG_KEY_ALIAS }}
          DELIFAR_DEBUG_KEY_PASSWORD: ${{ secrets.DELIFAR_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare and verify signed APK artifact
        run: |
          mkdir -p output
          cp -f app/build/outputs/apk/debug/app-debug.apk output/DeliFar.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs output/DeliFar.apk
          sha256sum output/DeliFar.apk > output/DeliFar.apk.sha256
          cat output/DeliFar.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliFar-signed-apk
          path: |
            output/DeliFar.apk
            output/DeliFar.apk.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Clean up decoded secrets
        if: always()
        run: rm -f debug.keystore app/google-services.json

  release:
    name: Publish GitHub Release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DeliFar-signed-apk
          path: release-assets

      - name: Create or update GitHub Release with signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-assets/DeliFar.apk \
              release-assets/DeliFar.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-assets/DeliFar.apk \
              release-assets/DeliFar.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "DeliFar $TAG_NAME" \
              --generate-notes
          fi
