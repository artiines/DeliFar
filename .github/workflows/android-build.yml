name: Android Build, Startup Smoke Test & Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      allow_ephemeral_keystore:
        description: "Allow ephemeral debug keystore for non-distributable test run only"
        required: false
        default: false
        type: boolean
      skip_emulator_smoke_test:
        description: "Skip Android emulator startup smoke test (emergency use only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint, Build & Sign DeliFar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore preserved Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DELIFAR_KEYSTORE_BASE64 }}
          ALLOW_EPHEMERAL: ${{ inputs.allow_ephemeral_keystore }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > debug.keystore
            if [ ! -s debug.keystore ]; then
              echo "::error::DELIFAR_KEYSTORE_BASE64 decoded to an empty file."
              exit 1
            fi
            echo "Restored project signing keystore (debug.keystore) from DELIFAR_KEYSTORE_BASE64."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_EPHEMERAL" = "true" ]; then
            echo "::warning::Running non-distributable test build without DELIFAR_KEYSTORE_BASE64."
          else
            echo "::error::DELIFAR_KEYSTORE_BASE64 repository secret is required for distributable builds on main and version tags so upgrades preserve your existing Android signing identity. Refusing to silently sign with an ephemeral keystore."
            exit 1
          fi

      - name: Decode optional google-services.json from repository secret
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building with offline-first Room mode enabled."
          fi

      - name: Run unit, Room migration & Robolectric tests (offline Gradle-cached SDK 34 & 35)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble signed APK
        env:
          DELIFAR_DEBUG_STORE_PASSWORD: ${{ secrets.DELIFAR_DEBUG_STORE_PASSWORD }}
          DELIFAR_DEBUG_KEY_ALIAS: ${{ secrets.DELIFAR_DEBUG_KEY_ALIAS }}
          DELIFAR_DEBUG_KEY_PASSWORD: ${{ secrets.DELIFAR_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Crashlytics build ID resource when Firebase is enabled
        run: |
          if [ -f app/google-services.json ]; then
            echo "Firebase config detected — verifying Crashlytics build ID resource is present in merged resources..."
            if ! grep -rn "com.google.firebase.crashlytics.mapping_file_id" app/build/intermediates/ >/dev/null 2>&1; then
              echo "::error::Firebase is configured, but com.google.firebase.crashlytics.mapping_file_id is missing! This causes an immediate startup crash in CrashlyticsCore.onPreExecute()."
              exit 1
            fi
            echo "Verified: com.google.firebase.crashlytics.mapping_file_id is generated and bundled."
          else
            echo "Offline build (no app/google-services.json); Crashlytics build ID check skipped."
          fi

      - name: Verify APK signature and generate SHA-256 checksum
        run: |
          mkdir -p output
          cp -f app/build/outputs/apk/debug/app-debug.apk output/DeliFar.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs output/DeliFar.apk
          sha256sum output/DeliFar.apk > output/DeliFar.apk.sha256
          cat output/DeliFar.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliFar-signed-apk
          path: |
            output/DeliFar.apk
            output/DeliFar.apk.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload test & lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Clean up decoded secrets
        if: always()
        run: rm -f debug.keystore app/google-services.json

  emulator-smoke-test:
    name: Real Android Emulator Startup Smoke Test (API 34)
    needs: build
    if: ${{ inputs.skip_emulator_smoke_test != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore optional google-services.json & keystore for emulator verification
        env:
          KEYSTORE_B64: ${{ secrets.DELIFAR_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          fi
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
            echo "Running Android Emulator startup test WITH Firebase configuration enabled."
          else
            echo "Running Android Emulator startup test in Offline Mode (no google-services.json)."
          fi

      - name: Run Instrumentation Startup Smoke Test on Android 14 (API 34) Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            if adb logcat -d | grep -E "FATAL EXCEPTION|Crashlytics build ID is missing" >/dev/null 2>&1; then
              echo "::error::Fatal runtime exception detected in emulator logcat!"
              adb logcat -d -s AndroidRuntime:E DeliFarFirebase:W
              exit 1
            fi
            echo "Emulator startup smoke test passed with zero FATAL EXCEPTIONs."

      - name: Clean up decoded secrets
        if: always()
        run: rm -f debug.keystore app/google-services.json

  release:
    name: Publish GitHub Release APK
    needs: [build, emulator-smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DeliFar-signed-apk
          path: release-assets

      - name: Create or update GitHub Release with signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              release-assets/DeliFar.apk \
              release-assets/DeliFar.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              release-assets/DeliFar.apk \
              release-assets/DeliFar.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "DeliFar $TAG_NAME" \
              --generate-notes
          fi
